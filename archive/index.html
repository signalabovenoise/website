<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter Archive</title>
  <style>
    /* Reset & Base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9fafb;
      color: #111827;
      line-height: 1.6;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 2rem;
      color: #111827;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Card */
    .card {
      display: block;
      padding: 1.5rem;
      background: white;
      border-radius: 1rem;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }
    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      color: #1f2937;
    }
    .card p {
      font-size: 0.9rem;
      color: #6b7280;
    }

    /* Footer */
    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.8rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <h1>📬 Newsletter Archive</h1>
  <div class="grid" id="newsletter_cards">
    <!-- Example newsletter entries -->
    <a class="card" href="2025-09-23.html">
      <h2>September 23, 2025</h2>
      <p>Fresh breakdown of key sectors and investment opportunities.</p>
    </a>
  </div>

  <footer>
    © 2025 Signal Above Noise · All Rights Reserved
  </footer>
</body>
</html>
